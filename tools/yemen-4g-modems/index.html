    /* LCP Optimization: Ensure home content is rendered early but hidden by preloader */
    #home-content {
      opacity: 1 !important;
      visibility: visible !important;
      filter: none !important;
    }

    /* Zero CLS Font Matching: Pre-adjust fallback font metrics */

<style>
    body { background-color: #f8fafc; }

    /* Advanced Header - White Style */
    .modems-header {
        background: #ffffff;
        padding: 100px 0 60px;
        color: #333;
        text-align: center;
        border-bottom: 1px solid #eee;
    }
    .modems-header h1 { font-weight: 800; font-size: 36px; margin-bottom: 15px; color: #006b98 !important; }
    .modems-header p { font-size: 18px; color: #64748b; max-width: 700px; margin: 0 auto; }

    .breadcrumb-tools {
        list-style: none; display: flex; justify-content: center; gap: 10px; padding: 0; margin: 20px 0 0;
    }
    .breadcrumb-tools li { color: #888; font-weight: 600; font-size: 14px; }
    .breadcrumb-tools li a { color: #006b98; text-decoration: none; }
    .breadcrumb-tools li:not(:last-child)::after {
        content: '\f104'; font-family: FontAwesome; margin-right: 10px; font-size: 12px; color: #ccc;
    }
    .breadcrumb-tools li.active { color: #e89a2f; }

    .modem-list-container { padding-bottom: 80px; }

    /* Filter Tabs */
    .filter-tabs {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 40px;
        flex-wrap: wrap;
    }
    .filter-btn {
        padding: 10px 30px;
        border-radius: 50px;
        background: #fff;
        color: #555;
        font-weight: 700;
        border: 2px solid transparent;
        cursor: pointer;
        transition: 0.3s;
        box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .filter-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.1); }
    .filter-btn.active { background: #e89a2f; color: #fff; border-color: #e89a2f; }

    /* Modern Modem Card */
    .modem-card {
        background: #fff;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        margin-bottom: 30px;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        border: 1px solid rgba(0,0,0,0.02);
        display: flex;
        flex-direction: column;
        height: 100%;
        position: relative;
    }
    .modem-card:hover {
        transform: translateY(-10px) scale(1.02);
        box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    }

    .card-badge {
        position: absolute;
        top: 15px;
        right: 15px;
        z-index: 10;
        padding: 5px 15px;
        border-radius: 50px;
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .badge-new { background: #2ecc71; color: #fff; }
    .badge-portable { background: #006b98; color: #fff; }

    .modem-card .image-wrapper {
        position: relative;
        padding-top: 80%;
        background: #fdfdfd;
        border-bottom: 1px solid #f1f5f9;
    }
    .modem-card img {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        max-width: 80%;
        max-height: 80%;
        object-fit: contain;
        transition: 0.5s;
    }
    .modem-card:hover img { transform: translate(-50%, -50%) scale(1.1); }

    .modem-card .content { padding: 25px; flex-grow: 1; display: flex; flex-direction: column; }
    .modem-card .category { font-size: 11px; color: #94a3b8; font-weight: 800; text-transform: uppercase; margin-bottom: 8px; display: block; }
    .modem-card h3 { font-size: 20px; color: #1e293b; font-weight: 800; margin: 0 0 12px; height: 56px; overflow: hidden; line-height: 1.4; }
    .modem-card .short-desc { color: #64748b; font-size: 14px; margin-bottom: 20px; height: 42px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

    .btn-view-details {
        background: #f1f5f9;
        color: #006b98;
        padding: 12px 20px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 700;
        text-align: center;
        transition: 0.3s;
        margin-top: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: none;
    }
    .btn-view-details:hover { background: #006b98; color: #fff; text-decoration: none; }

    .loading-spinner { text-align: center; padding: 100px 0; color: #006b98; }
    .error-msg { text-align: center; color: #ef4444; padding: 100px 0; font-weight: 700; }

    @media (max-width: 768px) {
        .modems-header { padding: 80px 0 120px; }
        .modems-header h1 { font-size: 28px; }
    }
</style>

<body oncontextmenu="return false;" style="user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none;">

<!-- Modular Web Component: Header -->
<site-header></site-header>

<main id="main-content">

<div class="modems-header">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <h1>دليل مودمات يمن فورجي</h1>
                <p>استكشف المواصفات التقنية الكاملة لمودمات Yemen 4G المعتمدة واختر ما يناسب احتياجاتك</p>
            </div>
        </div>
    </div>
</div>

<div class="modem-list-container">
    <div class="container">
        <!-- Filter Tabs -->
        <div class="filter-tabs">
            <button class="filter-btn active" data-filter="all">الكل</button>
            <button class="filter-btn" data-filter="مودم منزلي">منزلية (Fixed)</button>
            <button class="filter-btn" data-filter="مودم محمول">محمولة (Portable)</button>
        </div>

        <div class="row" id="modems-grid">
            <div class="loading-spinner col-xs-12">
                <i class="fa fa-circle-o-notch fa-spin fa-3x"></i>
                <p style="margin-top: 15px;">جاري جلب بيانات المودمات...</p>
            </div>
        </div>
    </div>
</div>

<!-- Modular Web Component: Footer -->



<script type="text/javascript">
    $(document).ready(function() {
        const apiUrl = 'https://api.connecttag.app/v5/yemen4g/lists?X-Api-Key=ktmo5flizpu';
        let allItems = [];

        // Fetch Data
        $.ajax({
            url: apiUrl,
            method: 'GET',
            dataType: 'json',
            success: function(response) {
                if (response.success && response.result && response.result.items) {
                    allItems = response.result.items;
                    renderModems(allItems);
                } else {
                    showError('عذراً، فشل تحميل البيانات من السيرفر.');
                }
            },
            error: function() {
                showError('حدث خطأ في الـ CORS أو الاتصال. يرجى تفعيل إضافة CORS محلياً.');
            }
        });

        // Filter Logic
        $('.filter-btn').click(function() {
            $('.filter-btn').removeClass('active');
            $(this).addClass('active');
            const filter = $(this).data('filter');

            const filteredItems = filter === 'all' ?
                                allItems :
                                allItems.filter(i => i.category === filter);
            renderModems(filteredItems);
        });

        function renderModems(items) {
            const grid = $('#modems-grid');
            grid.empty();

            if(items.length === 0) {
                grid.html('<div class="col-xs-12 text-center" style="padding:50px; color:#777;"><h4>لا توجد مودمات في هذا القسم حالياً</h4></div>');
                return;
            }

            items.forEach(item => {
                const badge = item.isNew ? '<span class="card-badge badge-new">جديد</span>' :
                             (item.additional && item.additional.portable ? '<span class="card-badge badge-portable">محمول</span>' : '');

                const cardHtml = `
                    <div class="col-md-4 col-sm-6" style="margin-bottom:30px;">
                        <div class="modem-card">
                            ${badge}
                            <div class="image-wrapper">
                                <img src="${item.image.content}" alt="${item.arabicName} ${item.modelOrVersion}" loading="lazy" oncontextmenu="return false;" draggable="false">
                            </div>
                            <div class="content">
                                <span class="category">${item.category}</span>
                                <h3>${item.arabicName} ${item.modelOrVersion}</h3>
                                <p class="short-desc">${item.shortDescription || item.summary || 'مودم يدعم تقنية الجيل الرابع.'}</p>
                                <a href="details.html?slug=${item.slug}" class="btn-view-details">
                                    المواصفات الفنية <i class="fa fa-long-arrow-left"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                `;
                grid.append(cardHtml);
            });
        }

        function showError(message) {
            $('#modems-grid').html(`<div class="error-msg col-xs-12"><i class="fa fa-exclamation-triangle fa-3x"></i><p style="margin-top:15px;">${message}</p></div>`);
        }
    });
</script>
</main>

<!-- Modular Web Component: Footer -->
<site-footer></site-footer>

<cookie-consent></cookie-consent>

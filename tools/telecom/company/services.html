<style>
    body { font-family: 'Cairo', sans-serif; background-color: #f4f7f6; }

    /* Header & Navbar */
    .header-bar { background: #fff; padding: 15px 0; border-bottom: 1px solid #e2e8f0; box-shadow: 0 2px 15px rgba(0,0,0,0.02); position: sticky; top: 0; z-index: 1000; }

    .btn-back:hover { color: #006b98; transform: translateX(5px); }

    .services-main { padding: 40px 0 80px; }

    /* Search Section */
    .search-section { margin-bottom: 40px; }
    .search-wrapper { position: relative; max-width: 600px; margin: 0 auto; }
    .search-input {
        width: 100%;
        height: 55px;
        border-radius: 50px;
        border: 2px solid #e2e8f0;
        padding: 0 50px 0 25px;
        font-size: 16px;
        font-weight: 600;
        transition: 0.3s;
        box-shadow: 0 4px 6px rgba(0,0,0,0.02);
    }
    .search-input:focus { border-color: #006b98; box-shadow: 0 10px 20px rgba(0, 107, 152, 0.1); outline: none; }
    .search-icon { position: absolute; top: 50%; right: 20px; transform: translateY(-50%); color: #94a3b8; font-size: 18px; }

    /* Service Grid */
    .services-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 20px;
    }

    /* Professional Service Card */
    .service-card {
        background: #fff;
        border-radius: 20px;
        padding: 25px;
        border: 1px solid #f1f5f9;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: 100%;
        position: relative;
        overflow: hidden;
    }
    .service-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 20px 40px rgba(0,0,0,0.06);
        border-color: #006b98;
    }
    .service-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 4px; height: 100%;
        background: #006b98;
        opacity: 0; transition: 0.3s;
    }
    .service-card:hover::before { opacity: 1; }

    .card-top { display: flex; align-items: flex-start; gap: 15px; margin-bottom: 20px; }
    .service-icon-box {
        width: 50px; height: 50px;
        background: #f0f7fa;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #006b98;
        font-size: 20px;
        flex-shrink: 0;
    }
    .service-meta { flex-grow: 1; }
    .service-label { font-size: 11px; color: #94a3b8; font-weight: 800; text-transform: uppercase; margin-bottom: 4px; display: block; }
    .service-title { font-size: 18px; font-weight: 800; color: #1e293b; line-height: 1.4; margin: 0; }

    /* Modern Code Interaction */
    .code-action-box {
        background: #f8fafc;
        border: 2px solid #eef2f6;
        border-radius: 15px;
        padding: 12px 15px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        transition: 0.2s;
    }
    .code-action-box:hover { background: #f0f7fa; border-color: #006b98; }
    .code-text { font-family: 'Courier New', monospace; font-size: 20px; font-weight: 900; color: #1e293b; letter-spacing: 1px; }
    .btn-copy-action { color: #006b98; font-size: 16px; background: #fff; width: 35px; height: 35px; border-radius: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

    /* Website Link Action */
    .link-action-box {
        background: #006b98;
        border-radius: 15px;
        padding: 12px 15px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        text-decoration: none !important;
        transition: 0.3s;
        border: 2px solid #006b98;
    }
    .link-action-box:hover {
        background: #00567a;
        border-color: #00567a;
        box-shadow: 0 5px 15px rgba(0, 107, 152, 0.3);
        transform: translateY(-2px);
    }
    .link-text { color: #fff; font-weight: 800; font-size: 16px; }
    .btn-link-action { color: #006b98; background: #fff; width: 35px; height: 35px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }

    /* Skeleton Loading */
    .skeleton { background: #eee; background: linear-gradient(110deg, #ececec 8%, #f5f5f5 18%, #ececec 33%); border-radius: 10px; background-size: 200% 100%; animation: 1.5s shine linear infinite; }
    @keyframes shine { to { background-position-x: -200%; } }
    .skeleton-card { height: 180px; border-radius: 20px; background: #fff; padding: 25px; }

    @media (max-width: 768px) {
        .services-grid { grid-template-columns: 1fr; }
        .page-header-title { font-size: 24px !important; }
    }

<script type="text/javascript">
    document.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);
        const companyId = urlParams.get('companyId');
        const apiUrl = 'https://api.connecttag.app/v5/yemenview/initial-data';
        const apiKey = 'ws9syryf5hyd';
        let allServices = [];

        if (!companyId) {
            window.location.href = 'https://connecttag.org/tools/telecom/company/';
            return;
        }

        // Fetch Data
        fetch(apiUrl, {
            method: 'GET',
            headers: { 'X-Api-Key': apiKey }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success && data.result) {
                const comp = data.result.companies.find(c => c.id === companyId);
                if(comp) {
                    document.getElementById('comp-name-header').textContent = comp.arName;
                    const logoHeader = document.getElementById('comp-logo-header');
                    logoHeader.src = comp.logo;
                    logoHeader.style.display = 'block';
                }

                allServices = data.result.services.filter(s => s.companyId === companyId);
                renderServices(allServices);
            }
        })
        .catch(error => {
            console.error('Error fetching data:', error);
            document.getElementById('services-list').innerHTML = '<p class="text-center col-xs-12">عذراً، حدث خطأ أثناء تحميل البيانات.</p>';
        });

        // Search Logic
        document.getElementById('serviceSearch').addEventListener('input', function() {
            const query = this.value.toLowerCase();
            const filtered = allServices.filter(s =>
                s.arTitle.toLowerCase().includes(query) ||
                (s.actions && s.actions[0] && s.actions[0].content.includes(query))
            );
            renderServices(filtered);
        });

        function renderServices(services) {
            const list = document.getElementById('services-list');
            list.innerHTML = '';

            if(services.length === 0) {
                list.innerHTML = '<div class="col-xs-12 text-center" style="padding: 50px;"><i class="fa-solid fa-magnifying-glass fa-3x" style="color: #cbd5e1; margin-bottom: 20px;"></i><p style="color: #64748b; font-weight: 700;">لا توجد نتائج تطابق بحثك</p></div>';
                return;
            }

            services.forEach(s => {
                const action = s.actions && s.actions[0] ? s.actions[0].content : '';
                const isUrl = action.startsWith('http') || action.includes('.ye') || action.includes('.com') || action.includes('.net');
                const card = document.createElement('div');
                card.className = 'service-card';

                let actionHtml = '';
                let label = 'كود تفعيل';

                if (isUrl) {
                    label = 'رابط الخدمة';
                    let finalUrl = action.startsWith('http') ? action : 'https://' + action;
                    actionHtml = `
                        <a href="${finalUrl}" target="_blank" class="link-action-box">
                            <span class="link-text">زيارة الموقع</span>
                            <div class="btn-link-action"><i class="fa-solid fa-arrow-up-right-from-square"></i></div>
                        </a>
                    `;
                } else {
                    actionHtml = `
                        <div class="code-action-box" onclick="copyToClipboard('${action}')">
                            <span class="code-text" dir="ltr">${action}</span>
                            <div class="btn-copy-action"><i class="fa-solid fa-copy"></i></div>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="card-top">
                        <div class="service-icon-box"><i class="fa ${getIcon(s.arTitle, isUrl)}"></i></div>
                        <div class="service-meta">
                            <span class="service-label">${label}</span>
                            <h3 class="service-title">${s.arTitle}</h3>
                        </div>
                    </div>
                    ${actionHtml}
                `;
                list.appendChild(card);
            });
        }

        function getIcon(title, isUrl) {
            if(isUrl) return 'fa-globe';
            if(title.includes('رصيد')) return 'fa-money-bill-1';
            if(title.includes('إنترنت') || title.includes('نت')) return 'fa-globe';
            if(title.includes('اتصال') || title.includes('دقائق')) return 'fa-phone';
            if(title.includes('سلف')) return 'fa-hand-holding-dollar';
            if(title.includes('تحويل')) return 'fa-shuffle';
            return 'fa-bolt';
        }
    });

    function copyToClipboard(text) {
        if(!text) return;
        navigator.clipboard.writeText(text).then(() => {
            const msg = "تم نسخ الكود: " + text;
            alert(msg);
        });
    }
</script>

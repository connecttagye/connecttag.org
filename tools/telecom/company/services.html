            right: 15px;

            color: #94a3b8;
        }
        .btn-back-link {
            background: #f8fafc;
            color: #0052cc;
            border: 1px solid #e2e8f0;
            padding: 9px 18px;
            border-radius: 10px;

            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .btn-back-link:hover {
            background: #006b98;
            color: #fff;
            border-color: #0052cc;
            text-decoration: none;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 22px;
        }
        .service-card {
            background: #ffffff;
            border-radius: 20px;

        .inline-input-tag.has-val {
            background: #ecfdf5;
            color: #047857;
            border-color: #10b981;
            border-style: solid;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            font-weight: bold;

        .actions-btn-group {

            text-decoration: none !important;

        .btn-act:hover {
            background: #006b98;
            color: #fff;
            border-color: #0052cc;
        }

        .link-action-box {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            color: #0369a1;
            border-radius: 14px;
            padding: 11px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none !important;
            transition: 0.2s;
            font-weight: 700;
            font-size: 13px;
        }
        .link-action-box:hover {
            background: #006b98;
            color: #ffffff;
            border-color: #0052cc;
        }

        /* Skeleton Loading */
        .skeleton-card {
            background: #fff;
            border-radius: 20px;
            padding: 24px;
            border: 1px solid #edf2f7;
        }
        .skeleton-line {
            height: 14px;
            background: linear-gradient(90deg, #f0f3f6 25%, #e6ecf1 50%, #f0f3f6 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 6px;
            margin-bottom: 12px;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .empty-state { text-align: center; padding: 60px 15px; color: #64748b; }
        .empty-state i { color: #cbd5e1; margin-bottom: 15px; }

        /* Toast */
        .toast-msg {
            visibility: hidden;
            min-width: 250px;
            background-color: #1e293b;
            color: #fff;
            text-align: center;
            border-radius: 10px;
            padding: 12px 20px;
            position: fixed;
            z-index: 1100;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            opacity: 0;
            transition: 0.3s;
        }
        .toast-msg.show { visibility: visible; opacity: 1; bottom: 40px; }

        @media (max-width: 768px) {
            .services-header h1 { font-size: 24px; }
            .toolbar-wrapper { flex-direction: column; align-items: stretch; }

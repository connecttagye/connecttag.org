<style>
    body { font-family: 'Cairo', sans-serif; background-color: #fff; }
    .company-header { padding: 60px 0; background: #ffffff; border-bottom: 1px solid #eee; text-align: center; }
    .company-logo-big { width: 150px; height: 150px; object-fit: contain; margin-bottom: 20px; background: #fff; padding: 20px; border-radius: 50%; box-shadow: 0 5px 20px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; }
    .company-name-big { font-size: 32px; font-weight: 800; color: #006b98; }

    .details-container { padding: 60px 0; }
    .info-section { margin-bottom: 40px; }
    .info-section h3 { font-weight: 800; color: #006b98; margin-bottom: 20px; border-right: 5px solid #e89a2f; padding-right: 15px; }
    .info-section p { font-size: 18px; line-height: 1.8; color: #475569; }

    .action-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 40px; }
    .action-card {

    .action-card:hover { border-color: #006b98; transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    .action-card i { font-size: 40px; color: #006b98; margin-bottom: 20px; }
    .action-card span { display: block; font-size: 20px; font-weight: 800; color: #1e293b; }

    .contact-info { background: #f8fafc; padding: 30px; border-radius: 20px; margin-top: 30px; }

    .contact-item i { width: 25px; color: #006b98; }

    .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }

</div>

<!-- Modular Web Component: Header -->
<site-header></site-header>

<div id="company-content" style="display:none;">
    <div class="company-header">
        <div class="container">
            <ul class="breadcrumb-custom mb-4" style="font-size:12px; display: flex; justify-content: center;">
                <li><a href="../../../index.html">الرئيسية</a></li>
                <li><a href="../../index.html">الأدوات</a></li>
                <li><a href="index.html">دليل الشركات</a></li>
                <li class="active" id="breadcrumb-company-name">تفاصيل الشركة</li>
            </ul>
            <img src="" id="comp-logo" class="company-logo-big" alt="Logo">
            <h1 id="comp-name" class="company-name-big"></h1>
            <div id="social-links" style="margin-top: 20px; font-size: 24px;"></div>
        </div>
    </div>

    <div class="details-container">
        <div class="container">
            <div class="row">
                <div class="col-md-8">
                    <div class="info-section">
                        <p id="comp-desc"></p>
                    </div>

                    <div class="action-cards">
                        <a href="" id="link-services" class="action-card">
                            <i class="fa-solid fa-code"></i>
                            <span>أكواد ومواقع الخدمات</span>
                        </a>
                        <a href="" id="link-packages" class="action-card">
                            <i class="fa-solid fa-cubes"></i>
                            <span>الباقات</span>
                        </a>
                    </div>
                </div>

                <div class="col-md-4">

                        <h4 style="font-weight: 800; margin-bottom: 20px;">معلومات التواصل</h4>
                        <div class="contact-item"><i class="fa-solid fa-globe"></i> الموقع الرسمي: <a href="#" id="comp-web" target="_blank">زيارة الموقع</a></div>
                        <div class="contact-item"><i class="fa-solid fa-phone"></i> خدمة العملاء: <span id="comp-phone"></span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modular Web Component: Footer -->
<site-footer></site-footer>

<script type="text/javascript">
    document.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);
        const companyId = urlParams.get('id');
        const apiUrl = 'https://api.connecttag.app/v5/yemenview/initial-data';
        const apiKey = 'ws9syryf5hyd';

        if (!companyId) {
            window.location.href = 'index.html';
            return;
        }

        fetch(apiUrl, {
            method: 'GET',
            headers: { 'X-Api-Key': apiKey }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success && data.result && data.result.companies) {
                const company = data.result.companies.find(c => c.id === companyId);
                if (company) {
                    renderDetails(company);
                } else {
                    alert('الشركة غير موجودة');
                    window.location.href = 'index.html';
                }
            }
        })
        .catch(error => {
            console.error('Error fetching data:', error);
            alert('خطأ في الاتصال');
            window.location.href = 'index.html';
        });

        function renderDetails(c) {
            document.title = `${c.arName} - أكواد ومواقع الخدمات - كونكت تاق`;
            document.getElementById('comp-logo').src = c.logo;
            document.getElementById('comp-name').textContent = c.arName;
            document.getElementById('comp-desc').textContent = c.arDescription || 'معلومات الشركة غير متوفرة حالياً.';

            const compWeb = document.getElementById('comp-web');
            compWeb.href = c.website;
            compWeb.textContent = c.website;

            document.getElementById('comp-phone').textContent = c.phoneNumbers ? c.phoneNumbers.join(' - ') : 'غير متوفر';

            document.getElementById('link-services').href = `services.html?companyId=${c.id}`;
            document.getElementById('link-packages').href = `packages.html?companyId=${c.id}`;

            // Social links
            const socialLinksDiv = document.getElementById('social-links');
            if(c.socialLinks) {
                c.socialLinks.forEach(s => {
                    if(s.active) {
                        let content = '';
                        if(s.type === 'FACEBOOK') content = '<i class="fa-brands fa-facebook"></i>';
                        else if(s.type === 'TWITTER' || s.type === 'X') {
                            content = '<svg style="width: 20px; height: 20px; fill: currentColor; vertical-align: middle;" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>';
                        } else if(s.type === 'INSTAGRAM') content = '<i class="fa-brands fa-instagram"></i>';
                        else if(s.type === 'YOUTUBE') content = '<i class="fa-brands fa-youtube"></i>';
                        else if(s.type === 'TELEGRAM') content = '<i class="fa-brands fa-telegram"></i>';
                        else if(s.type === 'GITHUB') content = '<i class="fa-brands fa-github"></i>';
                        else if(s.type === 'GITLAB') content = '<i class="fa-brands fa-gitlab"></i>';
                        else if(s.type === 'TIKTOK') {
                            content = '<svg style="width: 20px; height: 20px; fill: currentColor; vertical-align: middle;" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.9-.32-1.98-.23-2.81.36-.54.38-.89.98-1.03 1.64-.13.47-.1.99.09 1.44.35 1.03 1.5 1.74 2.59 1.61.88-.04 1.65-.58 2.02-1.37.15-.33.24-.69.24-1.05V0z"/></svg>';
                        } else if(s.type === 'KIK') {
                            content = '<svg style="width: 20px; height: 20px; fill: currentColor; vertical-align: middle;" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm3.844 17.188c-.524 0-.949-.425-.949-.949 0-.524.425-.949.949-.949.524 0 .949.425.949.949 0 .524-.425.949-.949.949zm.281-2.922c-.622 0-1.125-.503-1.125-1.125 0-.622.503-1.125 1.125-1.125.622 0 1.125.503 1.125 1.125 0 .622-.503 1.125-1.125 1.125zm-2.125 0c-.622 0-1.125-.503-1.125-1.125 0-.622.503-1.125 1.125-1.125.622 0 1.125.503 1.125 1.125 0 .622-.503 1.125-1.125 1.125zm-1.125 2.922c-.524 0-.949-.425-.949-.949 0-.524.425-.949.949-.949.524 0 .949.425.949.949 0 .524-.425.949-.949.949zm-1.844-2.922c-.622 0-1.125-.503-1.125-1.125 0-.622.503-1.125 1.125-1.125.622 0 1.125.503 1.125 1.125 0 .622-.503 1.125-1.125 1.125zm-2.125 0c-.622 0-1.125-.503-1.125-1.125 0-.622.503-1.125 1.125-1.125.622 0 1.125.503 1.125 1.125 0 .622-.503 1.125-1.125 1.125zm-.281 2.922c-.524 0-.949-.425-.949-.949 0-.524.425-.949.949-.949.524 0 .949.425.949.949 0 .524-.425.949-.949.949z"/></svg>';
                        } else if(s.type === 'SNAPCHAT') content = '<i class="fa-brands fa-snapchat"></i>';
                        else {
                            content = '<i class="fa-solid fa-arrow-up-right-from-square"></i>';
                        }

                        const a = document.createElement('a');
                        a.href = s.value;
                        a.target = '_blank';
                        a.style.margin = '0 10px';
                        a.style.color = '#006b98';
                        a.innerHTML = content;
                        socialLinksDiv.appendChild(a);
                    }
                });
            }

            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('company-content').style.display = 'block';
        }
    });
</script>
<!-- Modular Web Component: Cookie Consent -->
<cookie-consent></cookie-consent>
</body>
</html>

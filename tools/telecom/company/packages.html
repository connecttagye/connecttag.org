    <style>
        @font-face {
          font-family: 'Cairo-Fallback';
          src: local('Arial');
          ascent-override: 100%;
          descent-override: 20%;
          line-gap-override: 0%;
          size-adjust: 105.7%;
        }

        body {
          font-family: 'Cairo', 'Cairo-Fallback', sans-serif;
          background-color: #f8fafc;
          color: #1e293b;
        }

        /* Breadcrumbs Bar */
        .breadcrumb-wrapper {
            background: #ffffff;
            padding: 16px 0;
            border-bottom: 1px solid #edf2f7;
        }
        .breadcrumb-tools {
            list-style: none;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0;
            margin: 0;
            flex-wrap: wrap;
        }
        .breadcrumb-tools li { color: #64748b; font-weight: 600; font-size: 13px; }
        .breadcrumb-tools li a { color: #006b98; text-decoration: none; transition: 0.2s; }
        .breadcrumb-tools li a:hover { color: #e89a2f; }
        .breadcrumb-tools li:not(:last-child)::after {
            content: '\f104';
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            margin-right: 10px;
            font-size: 11px;
            color: #cbd5e1;
        }
        .breadcrumb-tools li.active { color: #e89a2f; font-weight: 700; }

        /* Page Header */
        .packages-header {
            background: #ffffff;
            padding: 45px 0 35px;
            border-bottom: 1px solid #edf2f7;
            text-align: center;
        }
        .company-badge-logo {
            width: 65px;
            height: 65px;
            object-fit: contain;
            background: #f8fafc;
            padding: 8px;
            border-radius: 18px;
            border: 1px solid #edf2f7;
            margin-bottom: 12px;
            display: inline-block;
        }
        .packages-header h1 {
            font-weight: 900;
            font-size: 30px;
            color: #006b98;
            margin: 0 0 10px;
        }
        .packages-header p {
            font-size: 15px;
            color: #64748b;
            margin: 0 auto;
            max-width: 600px;
        }

        /* Container & Toolbar */
        .packages-container { padding: 40px 0 80px; }

        .toolbar-wrapper {
            background: #ffffff;
            padding: 15px 20px;
            border-radius: 18px;
            border: 1px solid #edf2f7;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }
        .search-box {
            position: relative;
            flex: 1;
            min-width: 250px;
        }
        .search-box input {
            width: 100%;
            padding: 10px 42px 10px 16px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            font-size: 13.5px;
            outline: none;
            transition: 0.3s;
        }
        .search-box input:focus {
            border-color: #006b98;
            box-shadow: 0 0 0 3px rgba(0, 107, 152, 0.1);
        }
        .search-box i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }
        .btn-back-link {
            background: #f8fafc;
            color: #006b98;
            border: 1px solid #e2e8f0;
            padding: 9px 18px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .btn-back-link:hover {
            background: #006b98;
            color: #fff;
            border-color: #006b98;
            text-decoration: none;
        }

        /* Package Cards Grid */
        .pkg-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 22px;
        }
        .pkg-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 26px;
            border: 1px solid #edf2f7;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .pkg-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.07);
            border-color: #006b98;
        }
        .pkg-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(to left, #e89a2f, #006b98);
        }

        .pkg-title {
            font-size: 18px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 12px;
            line-height: 1.4;
            min-height: 50px;
        }
        .pkg-price-wrap {
            display: flex;
            align-items: baseline;
            gap: 6px;
            margin-bottom: 8px;
        }
        .pkg-price {
            font-size: 30px;
            font-weight: 900;
            color: #006b98;
            line-height: 1;
        }
        .pkg-currency {
            font-size: 13px;
            color: #64748b;
            font-weight: 700;
        }
        .pkg-duration {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }
        .pkg-duration i { color: #e89a2f; }

        /* Code Box & Actions */
        .activate-box {
            background: #f8fafc;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid #edf2f7;
            margin-top: auto;
        }
        .activate-label {
            font-size: 11px;
            color: #64748b;
            font-weight: 700;
            margin-bottom: 8px;
            display: block;
        }
        .code-action-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .activate-code {
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: 800;
            color: #006b98;
            direction: ltr;
            text-align: left;
        }
        .actions-btn-group {
            display: flex;
            gap: 6px;
        }
        .btn-act {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            color: #334155;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            text-decoration: none !important;
        }
        .btn-act:hover {
            background: #006b98;
            color: #fff;
            border-color: #006b98;
        }

        /* Skeleton Loading */
        .skeleton-card {
            background: #fff;
            border-radius: 20px;
            padding: 26px;
            border: 1px solid #edf2f7;
        }
        .skeleton-line {
            height: 14px;
            background: linear-gradient(90deg, #f0f3f6 25%, #e6ecf1 50%, #f0f3f6 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 6px;
            margin-bottom: 14px;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .empty-state { text-align: center; padding: 60px 15px; color: #64748b; }
        .empty-state i { color: #cbd5e1; margin-bottom: 15px; }

        /* Toast */
        .toast-msg {
            visibility: hidden;
            min-width: 250px;
            background-color: #1e293b;
            color: #fff;
            text-align: center;
            border-radius: 10px;
            padding: 12px 20px;
            position: fixed;
            z-index: 1100;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            opacity: 0;
            transition: 0.3s;
        }
        .toast-msg.show { visibility: visible; opacity: 1; bottom: 40px; }

        @media (max-width: 768px) {
            .packages-header h1 { font-size: 24px; }
            .toolbar-wrapper { flex-direction: column; align-items: stretch; }
        }
    </style>

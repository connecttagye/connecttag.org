<style>
    body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
    .header-bar { background: #fff; padding: 20px 0; border-bottom: 1px solid #e1e8ed; }
    .btn-back { color: #006b98; font-weight: bold; text-decoration: none; }

    .packages-container { padding: 40px 0; }
    .pkg-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
    .pkg-card {
        background: #fff;
        border-radius: 20px;
        padding: 30px;
        border: 1px solid #eef2f3;
        box-shadow: 0 10px 25px rgba(0,0,0,0.03);
        transition: 0.3s;
        text-align: center;
        position: relative;
        overflow: hidden;
    }
    .pkg-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0,0,0,0.08); border-color: #006b98; }
    .pkg-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 5px; background: #006b98; }

    .pkg-title { font-size: 20px; font-weight: 800; color: #1e293b; margin-bottom: 15px; }
    .pkg-price { font-size: 32px; font-weight: 900; color: #e89a2f; margin-bottom: 5px; }
    .pkg-price small { font-size: 14px; color: #94a3b8; }
    .pkg-duration { color: #64748b; font-size: 14px; margin-bottom: 25px; }

    .activate-box { background: #f0f7fa; padding: 15px; border-radius: 12px; margin-top: 20px; }
    .activate-label { font-size: 12px; color: #006b98; font-weight: 800; margin-bottom: 5px; display: block; }
    .activate-code { font-size: 20px; font-weight: 900; color: #333; cursor: pointer; }
</style>

<body>
<!-- Modular Web Component: Header -->
<site-header></site-header>

<div class="header-bar">

        <ul class="breadcrumb-custom mb-3" style="font-size:11px; display: flex; justify-content: center;">

        </ul>

            <div class="col-xs-6">
                <a href="javascript:history.back()" class="btn-back"><i class="fa-solid fa-arrow-right"></i> العودة للشركة</a>
            </div>
            <div class="col-xs-6 text-left">
                <h4 id="comp-name-header" style="margin: 0; font-weight: 800; color: #1e293b;"></h4>
            </div>
        </div>
    </div>
</div>

<div class="packages-container">
    <div class="container">
        <h2 style="font-weight: 800; color: #006b98; margin-bottom: 30px;">الباقات المتاحة</h2>
        <div class="pkg-grid" id="packages-list">
            <!-- Packages will be injected here -->
        </div>
    </div>
</div>

<!-- Modular Web Component: Footer -->
<site-footer></site-footer>

<script type="text/javascript">
    document.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);
        const companyId = urlParams.get('companyId');
        const apiUrl = 'https://api.connecttag.app/v5/yemenview/initial-data';
        const apiKey = 'ws9syryf5hyd';

        fetch(apiUrl, {
            method: 'GET',
            headers: { 'X-Api-Key': apiKey }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success && data.result) {
                const comp = data.result.companies.find(c => c.id === companyId);
                document.getElementById('comp-name-header').textContent = comp ? comp.arName : '';

                const packages = data.result.packages.filter(p => p.companyId === companyId);
                renderPackages(packages);
            }
        })
        .catch(error => {
            console.error('Error fetching data:', error);
            document.getElementById('packages-list').innerHTML = '<p class="text-center">حدث خطأ أثناء تحميل البيانات.</p>';
        });

        function renderPackages(packages) {
            const list = document.getElementById('packages-list');
            list.innerHTML = '';

            if(packages.length === 0) {
                list.innerHTML = '<p class="text-center">لا توجد باقات مسجلة حالياً لهذه الشركة.</p>';
                return;
            }

            packages.forEach(p => {
                const card = document.createElement('div');
                card.className = 'pkg-card';
                card.innerHTML = `
                    <div class="pkg-title">${p.arTitle}</div>
                    <div class="pkg-price">${p.price.toLocaleString()} <small>ريال</small></div>
                    <div class="pkg-duration"><i class="fa-regular fa-clock"></i> صلاحية ${p.duration}</div>

                    <div class="activate-box" onclick="copyToClipboard('${p.codeActivate}')">
                        <span class="activate-label">كود التفعيل</span>
                        <span class="activate-code">${p.codeActivate} <i class="fa-solid fa-copy" style="font-size: 14px;"></i></span>
                    </div>
                `;
                list.appendChild(card);
            });
        }
    });

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => {
            alert('تم نسخ كود التفعيل: ' + text);
        });
    }
</script>
<!-- Modular Web Component: Cookie Consent -->
<cookie-consent></cookie-consent>
</body>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>دليل مودمات يمن فورجي 4G - المواصفات والإعدادات | كونكت تاق</title>
    <meta name="description" content="دليل شامل لجميع أجهزة ومودمات يمن فورجي (Yemen 4G) المعتمدة. استعرض المواصفات الفنية، الموديلات المنزلية والمحمولة، وروابط وبيانات الدخول للوحة التحكم.">
    <link rel="canonical" href="https://connecttag.org/tools/telecom/modems/">

    <!-- OpenGraph meta -->
    <meta property="og:url" content="https://connecttag.org/tools/telecom/modems/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="دليل مودمات يمن فورجي 4G - كونكت تاق">
    <meta property="og:description" content="استعرض المواصفات الفنية وإعدادات أجهزة مودم Yemen 4G المنزلية والمحمولة.">
    <meta property="og:image" content="https://connecttag.org/assets/img/about/connect-tag-it-company.webp">

    <!-- Twitter Meta -->

    <meta name="twitter:site" content="@connecttagye">
    <meta name="twitter:url" content="https://connecttag.org/tools/telecom/modems/">
    <meta name="twitter:title" content="دليل مودمات يمن فورجي 4G - كونكت تاق">
    <meta name="twitter:description" content="استعرض المواصفات الفنية وإعدادات أجهزة مودم Yemen 4G المنزلية والمحمولة.">
    <meta name="twitter:image" content="https://connecttag.org/assets/img/about/connect-tag-it-company.webp">

    <!-- Schema.org JSON-LD (Breadcrumb + Collection/ItemList) -->
    <script type="application/ld+json" id="schema-data">
        {
            "@context": "https://schema.org",
            "@graph": [
                {
                    "@type": "BreadcrumbList",
                    "itemListElement": [
                        {
                            "@type": "ListItem",
                            "position": 1,
                            "name": "الرئيسية",
                            "item": "https://connecttag.org/"
                        },
                        {
                            "@type": "ListItem",
                            "position": 2,
                            "name": "الأدوات",
                            "item": "https://connecttag.org/tools/"
                        },
                        {
                            "@type": "ListItem",
                            "position": 3,
                            "name": "دليل المودمات",
                            "item": "https://connecttag.org/tools/telecom/modems/"
                        }
                    ]
                },
                {
                    "@type": "CollectionPage",
                    "@id": "https://connecttag.org/tools/telecom/modems/",
                    "name": "دليل مودمات يمن فورجي 4G",
                    "description": "قائمة ومواصفات أجهزة مودم يمن فورجي الرسمية والمعتمدة",
                    "url": "https://connecttag.org/tools/telecom/modems/"
                }
            ]
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap">
    <link rel="stylesheet" href="https://connecttag.org/assets/css/bootstrap.css?v=1.1.5">
    <link rel="stylesheet" href="https://connecttag.org/assets/css/styles.min.css?v=1.1.5">
    <link rel="stylesheet" href="https://connecttag.org/assets/css/components.css?v=1.1.5">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
    <link rel="stylesheet" href="https://connecttag.org/assets/css/animate-custom.css?v=1.1.5">

    <script src="https://connecttag.org/assets/js/components/components-bundle.js?v=1.1.5" defer></script>
    <script src="https://connecttag.org/assets/js/components/site-toast.js?v=1.1.5" defer></script>

    <style>
        @font-face {
          font-family: 'Cairo-Fallback';
          src: local('Arial');
          ascent-override: 100%;
          descent-override: 20%;
          line-gap-override: 0%;
          size-adjust: 105.7%;
        }

        body {
          font-family: 'Cairo', 'Cairo-Fallback', sans-serif;
          background-color: #f8fafc;
          color: #1e293b;
        }

        /* Header */
        .modems-header {
            background: #ffffff;
            padding: 80px 0 45px;
            text-align: center;
            border-bottom: 1px solid #edf2f7;
        }
        .modems-header h1 {
            font-weight: 900;
            font-size: 34px;
            margin-bottom: 12px;
            color: #006b98 !important;
        }
        .modems-header p {
            font-size: 16px;
            color: #64748b;
            max-width: 680px;
            margin: 0 auto;
            line-height: 1.7;
        }

        .breadcrumb-tools {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 0;
            margin: 20px 0 0;
        }
        .breadcrumb-tools li { color: #888; font-weight: 600; font-size: 13px; }
        .breadcrumb-tools li a { color: #006b98; text-decoration: none; transition: 0.2s; }
        .breadcrumb-tools li a:hover { color: #e89a2f; }
        .breadcrumb-tools li:not(:last-child)::after {
            content: '\f104';
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            margin-right: 10px;
            font-size: 11px;
            color: #cbd5e1;
        }
        .breadcrumb-tools li.active { color: #e89a2f; font-weight: 700; }

        .modem-list-container { padding: 40px 0 80px; }

        /* Controls Bar: Search & Filter */
        .controls-wrapper {
            background: #fff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            margin-bottom: 30px;
            border: 1px solid #edf2f7;
        }
        .search-box {
            position: relative;
            margin-bottom: 15px;
        }
        .search-box input {
            width: 100%;
            padding: 12px 45px 12px 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            font-size: 14px;
            transition: 0.3s;
            outline: none;
        }
        .search-box input:focus {
            border-color: #006b98;
            box-shadow: 0 0 0 3px rgba(0, 107, 152, 0.1);
        }
        .search-box i {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        .filter-tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 8px 22px;
            border-radius: 50px;
            background: #f8fafc;
            color: #64748b;
            font-weight: 700;
            font-size: 13px;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            transition: 0.2s;
        }
        .filter-btn:hover { background: #e2e8f0; color: #1e293b; }
        .filter-btn.active { background: #006b98; color: #fff; border-color: #006b98; }

        .results-count {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 20px;
        }

        /* Modem Card */
        .modem-card {
            background: #fff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0,0,0,0.04);
            margin-bottom: 30px;
            transition: all 0.3s ease;
            border: 1px solid #f1f5f9;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }
        .modem-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.08);
            border-color: #e2e8f0;
        }

        .card-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 800;
        }
        .badge-new { background: #10b981; color: #fff; }
        .badge-portable { background: #006b98; color: #fff; }

        .modem-card .image-wrapper {
            position: relative;
            padding-top: 75%;
            background: #fafbfc;
            border-bottom: 1px solid #f1f5f9;
        }
        .modem-card img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 75%;
            max-height: 75%;
            object-fit: contain;
            transition: 0.3s;
        }
        .modem-card:hover img { transform: translate(-50%, -50%) scale(1.05); }

        .modem-card .content { padding: 22px; flex-grow: 1; display: flex; flex-direction: column; }
        .modem-card .category { font-size: 11px; color: #006b98; font-weight: 800; margin-bottom: 6px; display: block; }
        .modem-card h2 { font-size: 18px; color: #1e293b; font-weight: 800; margin: 0 0 10px; line-height: 1.4; }
        .modem-card .short-desc {
            color: #64748b;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .btn-view-details {
            background: #f8fafc;
            color: #006b98;
            padding: 10px 18px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            text-align: center;
            transition: 0.2s;
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid #e2e8f0;
        }
        .btn-view-details:hover { background: #006b98; color: #fff; border-color: #006b98; text-decoration: none; }

        /* Skeleton Placeholder Loading Animation */
        .skeleton-card {
            background: #fff;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid #edf2f7;
        }
        .skeleton-img {
            width: 100%;
            height: 160px;
            background: linear-gradient(90deg, #f0f3f6 25%, #e6ecf1 50%, #f0f3f6 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .skeleton-line {
            height: 14px;
            background: linear-gradient(90deg, #f0f3f6 25%, #e6ecf1 50%, #f0f3f6 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .empty-state { text-align: center; padding: 60px 15px; color: #64748b; }
        .empty-state i { color: #cbd5e1; margin-bottom: 15px; }

        @media (max-width: 768px) {
            .modems-header { padding: 60px 0 35px; }
            .modems-header h1 { font-size: 26px; }
            .controls-wrapper { padding: 15px; }
        }
    </style>

    <link rel="icon" href="https://connecttag.org/favicon.webp" type="image/webp">
    <link rel="apple-touch-icon" href="https://connecttag.org/icon-192.png">
    <link rel="manifest" href="https://connecttag.org/manifest.json">
    <meta name="theme-color" content="#0077b6">
</head>
<body>
<site-toast></site-toast>
<site-header></site-header>

<main id="main-content">
    <div class="modems-header">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <h1>دليل مودمات يمن فورجي 4G</h1>
                    <p>استكشف المواصفات التقنية الكاملة لجميع أجهزة ومودمات Yemen 4G المعتمدة واختر الجهاز الأنسب لاحتياجاتك المنزلية أو الشخصية.</p>
                    <ul class="breadcrumb-tools">
                        <li><a href="https://connecttag.org/">الرئيسية</a></li>
                        <li><a href="https://connecttag.org/tools/">الأدوات</a></li>
                        <li><a href="https://connecttag.org/tools/telecom/">أدوات الاتصالات</a></li>
                        <li class="active">دليل المودمات</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <div class="modem-list-container">
        <div class="container">
            <!-- Controls: Search & Category Filters -->
            <div class="controls-wrapper">
                <div class="row align-items-center">
                    <div class="col-md-6">
                        <div class="search-box">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="text" id="modem-search" placeholder="ابحث باسم المودم، الموديل، أو الماركة (مثال: ZTE, L818A)...">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="filter-tabs">
                            <button class="filter-btn active" data-filter="all">جميع المودمات</button>
                            <button class="filter-btn" data-filter="مودم منزلي">منزلية (Fixed)</button>
                            <button class="filter-btn" data-filter="مودم محمول">محمولة (Portable)</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="results-count" id="results-count">جاري تجهيز المودمات...</div>
            </div>

            <!-- Modems Grid -->
            <div class="row" id="modems-grid">
                <!-- Skeleton Placeholders -->
                <div class="col-md-4 col-sm-6 skeleton-item"><div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-line" style="width:40%;"></div><div class="skeleton-line" style="width:80%;"></div><div class="skeleton-line" style="width:60%;"></div></div></div>
                <div class="col-md-4 col-sm-6 skeleton-item"><div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-line" style="width:40%;"></div><div class="skeleton-line" style="width:80%;"></div><div class="skeleton-line" style="width:60%;"></div></div></div>
                <div class="col-md-4 col-sm-6 skeleton-item"><div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-line" style="width:40%;"></div><div class="skeleton-line" style="width:80%;"></div><div class="skeleton-line" style="width:60%;"></div></div></div>
            </div>
        </div>
    </div>
</main>

<site-footer></site-footer>
<cookie-consent></cookie-consent>

<script type="text/javascript">
    document.addEventListener('DOMContentLoaded', function() {
        const apiUrl = 'https://api.connecttag.app/v5/yemen4g/lists?X-Api-Key=ktmo5flizpu';
        const grid = document.getElementById('modems-grid');
        const searchInput = document.getElementById('modem-search');
        const countLabel = document.getElementById('results-count');

        let allItems = [];
        let currentFilter = 'all';
        let currentSearch = '';

        const CACHE_KEY = 'modems_list_cache';
        const CACHE_TIME = 12 * 60 * 60 * 1000; // 12 Hours

        function loadFromCache() {
            try {
                const cached = localStorage.getItem(CACHE_KEY);
                if (cached) {
                    const { data, timestamp } = JSON.parse(cached);
                    if (Date.now() - timestamp < CACHE_TIME) return data;
                }
            } catch (e) {
                console.warn('Cache access error', e);
            }
            return null;
        }

        function saveToCache(data) {
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify({ data: data, timestamp: Date.now() }));
            } catch (e) {
                console.warn('Cache write error', e);
            }
        }

        // Stale-While-Revalidate Strategy (0ms Instant Load)
        const cachedData = loadFromCache();
        if (cachedData && Array.isArray(cachedData) && cachedData.length > 0) {
            allItems = cachedData;
            applyFilters();
            updateSchemaItemList(allItems);
            fetchFreshData(true);
        } else {
            fetchFreshData(false);
        }

        function fetchFreshData(isBackground = false) {
            fetch(apiUrl)
            .then(res => res.json())
            .then(data => {
                if (data.success && data.result && Array.isArray(data.result.items)) {
                    allItems = data.result.items;
                    saveToCache(allItems);
                    applyFilters();
                    updateSchemaItemList(allItems);
                } else if (!isBackground) {
                    showError('تعذر استرجاع قائمة المودمات حالياً.');
                }
            })
            .catch(err => {
                console.error('Fetch error:', err);
                if (!isBackground && allItems.length === 0) {
                    showError('حدث خطأ في الاتصال بالخادم. يرجى المحاولة لاحقاً.');
                }
            });
        }

        // Filter Buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.getAttribute('data-filter');
                applyFilters();
            });
        });

        // Search Input with Debounce
        let searchTimeout;
        searchInput.addEventListener('input', function() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                currentSearch = searchInput.value.trim().toLowerCase();
                applyFilters();
            }, 150);
        });

        function applyFilters() {
            let filtered = allItems;

            // Filter by Category
            if (currentFilter !== 'all') {
                filtered = filtered.filter(item => item.category === currentFilter);
            }

            // Filter by Search Term
            if (currentSearch) {
                filtered = filtered.filter(item => {
                    const name = (item.arabicName || '').toLowerCase();
                    const model = (item.modelOrVersion || '').toLowerCase();
                    const brand = (item.brand || '').toLowerCase();
                    const desc = (item.description || '').toLowerCase();
                    return name.includes(currentSearch) || model.includes(currentSearch) || brand.includes(currentSearch) || desc.includes(currentSearch);
                });
            }

            renderModems(filtered);
        }

        function renderModems(items) {
            grid.innerHTML = '';
            countLabel.textContent = `تم العثور على ${items.length} مودم`;

            if (items.length === 0) {
                grid.innerHTML = `
                    <div class="col-12 text-center" style="width: 100%;">
                        <div class="empty-state">
                            <i class="fa-solid fa-box-open fa-4x"></i>
                            <h4>لم يتم العثور على أي أجهزة تطابق بحثك</h4>
                            <p class="text-muted">جرب استخدام كلمات بحث أخرى أو اختر فئة مختلفة.</p>
                            <button class="btn btn-sm btn-outline-primary mt-2" onclick="resetFilters()">إعادة ضبط البحث</button>
                        </div>
                    </div>
                `;
                return;
            }

            items.forEach(item => {
                const isPortable = (item.category && item.category.includes('محمول')) || (item.additional && item.additional.portable);
                const badge = item.isNew
                    ? '<span class="card-badge badge-new">جديد</span>'
                    : (isPortable ? '<span class="card-badge badge-portable">محمول</span>' : '');

                const targetSlug = encodeURIComponent(item.slug || item.id || '');
                const cardCol = document.createElement('div');
                cardCol.className = 'col-md-4 col-sm-6';
                cardCol.style.marginBottom = '30px';
                cardCol.innerHTML = `
                    <div class="modem-card">
                        ${badge}
                        <div class="image-wrapper">
                            <img src="${item.image?.content || 'https://connecttag.org/assets/img/about/connect-tag-it-company.webp'}"
                                 alt="${item.arabicName} ${item.modelOrVersion || ''}"
                                 loading="lazy"
                                 onerror="this.src='https://connecttag.org/assets/img/about/connect-tag-it-company.webp';">
                        </div>
                        <div class="content">
                            <span class="category">${item.category || 'مودم 4G'}</span>
                            <h2>${item.arabicName} ${item.modelOrVersion || ''}</h2>
                            <p class="short-desc">${item.shortDescription || item.description || 'المواصفات الكاملة وإعدادات الدخول لمودم يمن فورجي.'}</p>
                            <a href="https://connecttag.org/tools/telecom/modems/details?slug=${targetSlug}" class="btn-view-details">
                                المواصفات الفنية <i class="fa-solid fa-arrow-left-long"></i>
                            </a>
                        </div>
                    </div>
                `;
                grid.appendChild(cardCol);
            });
        }

        function updateSchemaItemList(items) {
            const schemaEl = document.getElementById('schema-data');
            if (!schemaEl || !items || items.length === 0) return;

            const itemList = {
                "@type": "ItemList",
                "name": "قائمة مودمات يمن فورجي",
                "numberOfItems": items.length,
                "itemListElement": items.slice(0, 15).map((item, idx) => ({
                    "@type": "ListItem",
                    "position": idx + 1,
                    "name": `${item.arabicName} ${item.modelOrVersion || ''}`.trim(),
                    "url": `https://connecttag.org/tools/telecom/modems/details?slug=${encodeURIComponent(item.slug || '')}`
                }))
            };

            try {
                const schemaObj = JSON.parse(schemaEl.textContent);
                if (schemaObj && Array.isArray(schemaObj['@graph'])) {
                    const existingIdx = schemaObj['@graph'].findIndex(node => node['@type'] === 'ItemList');
                    if (existingIdx !== -1) {
                        schemaObj['@graph'][existingIdx] = itemList;
                    } else {
                        schemaObj['@graph'].push(itemList);
                    }
                    schemaEl.textContent = JSON.stringify(schemaObj);
                }
            } catch (e) {
                console.warn('Schema injection warning:', e);
            }
        }

        window.resetFilters = function() {
            searchInput.value = '';
            currentSearch = '';
            currentFilter = 'all';
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('.filter-btn[data-filter="all"]').classList.add('active');
            applyFilters();
        };

        function showError(message) {
            grid.innerHTML = `<div class="col-12 text-center py-5 text-danger font-weight-bold" style="width: 100%;"><i class="fa-solid fa-circle-exclamation fa-2x mb-3"></i><p>${message}</p></div>`;
            countLabel.textContent = '';
        }
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../../favicon.webp" type="image/webp">
<meta name="robots" content="noindex, nofollow">
<title>تفاصيل الشركة - كونكت تاق</title>
<link href="../../assets/css/bootstrap.css" rel="stylesheet">
<link href="../../assets/css/styles.min.css" rel="stylesheet">
<link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="../../assets/js/jquery.min.js"></script>

<style>
    body { font-family: 'Cairo', sans-serif; background-color: #fff; }
    .company-header { padding: 60px 0; background: #ffffff; border-bottom: 1px solid #eee; text-align: center; }
    .company-logo-big { width: 150px; height: 150px; object-fit: contain; margin-bottom: 20px; background: #fff; padding: 20px; border-radius: 50%; box-shadow: 0 5px 20px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; }
    .company-name-big { font-size: 32px; font-weight: 800; color: #006b98; }

    .details-container { padding: 60px 0; }
    .info-section { margin-bottom: 40px; }
    .info-section h3 { font-weight: 800; color: #006b98; margin-bottom: 20px; border-right: 5px solid #e89a2f; padding-right: 15px; }
    .info-section p { font-size: 18px; line-height: 1.8; color: #475569; }

    .action-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 40px; }
    .action-card {
        background: #fff;
        border-radius: 20px;
        padding: 40px;
        text-align: center;
        transition: 0.3s;
        border: 2px solid #f1f5f9;
        text-decoration: none !important;
    }
    .action-card:hover { border-color: #006b98; transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    .action-card i { font-size: 40px; color: #006b98; margin-bottom: 20px; }
    .action-card span { display: block; font-size: 20px; font-weight: 800; color: #1e293b; }

    .contact-info { background: #f8fafc; padding: 30px; border-radius: 20px; margin-top: 30px; }
    .contact-item { margin-bottom: 15px; font-size: 16px; color: #64748b; }
    .contact-item i { width: 25px; color: #006b98; }

    .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
</style>
</head>
<body>

<div id="loading-screen" class="loading-overlay">
    <i class="fa fa-circle-o-notch fa-spin fa-3x" style="color: #006b98;"></i>
    <p style="margin-top: 20px; font-weight: 700;">جاري تحميل معلومات الشركة...</p>
</div>

<div id="navbar-main">
  <div class="navbar navbar-inverse navbar-fixed-top">
    <div class="container">
      <div class="navbar-header">
	   <div class="pull-right logo">
        <a href="../../index.html"><img src="../../assets/img/connect-tag-official-logo.webp" alt="كونكت تاق" loading="lazy"/></a>
       </div>
        <button type="button" class="navbar-toggle" data-toggle="collapse" data-target=".navbar-collapse"> <span class="icon-bar"></span> <span class="icon-bar"></span> <span class="icon-bar"></span> </button>
        </div>
      <div class="navbar-collapse collapse">
        <ul class="nav navbar-nav pull-left">
          <li><a href="../../index.html">الرئيسية</a></li>
          <li><a href="../../about/our-company.html">من نحن</a></li>
          <li class="active"><a href="../index.html">الأدوات</a></li>
          <li><a href="../../contact.html" class="nav-cta-btn">تواصل معنا</a></li>
        </ul>
      </div>
    </div>
  </div>
</div>

<div id="company-content" style="display:none;">
    <div class="company-header">
        <div class="container">
            <img src="" id="comp-logo" class="company-logo-big" alt="Logo">
            <h1 id="comp-name" class="company-name-big"></h1>
            <div id="social-links" style="margin-top: 20px; font-size: 24px;"></div>
        </div>
    </div>

    <div class="details-container">
        <div class="container">
            <div class="row">
                <div class="col-md-8">
                    <div class="info-section">
                        <h3>عن الشركة</h3>
                        <p id="comp-desc"></p>
                    </div>

                    <div class="action-cards">
                        <a href="" id="link-services" class="action-card">
                            <i class="fa fa-code"></i>
                            <span>أكواد الخدمات</span>
                        </a>
                        <a href="" id="link-packages" class="action-card">
                            <i class="fa fa-cubes"></i>
                            <span>باقات الإنترنت</span>
                        </a>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="contact-info">
                        <h4 style="font-weight: 800; margin-bottom: 20px;">معلومات التواصل</h4>
                        <div class="contact-item"><i class="fa fa-globe"></i> الموقع الرسمي: <a href="#" id="comp-web" target="_blank">زيارة الموقع</a></div>
                        <div class="contact-item"><i class="fa fa-phone"></i> خدمة العملاء: <span id="comp-phone"></span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $(document).ready(function() {
        const urlParams = new URLSearchParams(window.location.search);
        const companyId = urlParams.get('id');
        const apiUrl = 'https://api.connecttag.app/v5/yemenview/initial-data';
        const apiKey = 'ws9syryf5hyd';

        if (!companyId) {
            window.location.href = 'index.html';
            return;
        }

        $.ajax({
            url: apiUrl,
            method: 'GET',
            headers: { 'X-Api-Key': apiKey },
            success: function(response) {
                if (response.success && response.result && response.result.companies) {
                    const company = response.result.companies.find(c => c.id === companyId);
                    if (company) {
                        renderDetails(company);
                    } else {
                        alert('الشركة غير موجودة');
                        window.location.href = 'index.html';
                    }
                }
            },
            error: function() {
                alert('خطأ في الاتصال');
                window.location.href = 'index.html';
            }
        });

        function renderDetails(c) {
            document.title = `${c.arName} - خدمات وأكواد - كونكت تاق`;
            $('#comp-logo').attr('src', c.logo);
            $('#comp-name').text(c.arName);
            $('#comp-desc').text(c.arDescription || 'معلومات الشركة غير متوفرة حالياً.');
            $('#comp-web').attr('href', c.website).text(c.website);
            $('#comp-phone').text(c.phoneNumbers ? c.phoneNumbers.join(' - ') : 'غير متوفر');

            $('#link-services').attr('href', `services.html?companyId=${c.id}`);
            $('#link-packages').attr('href', `packages.html?companyId=${c.id}`);

            // Social links
            if(c.socialLinks) {
                c.socialLinks.forEach(s => {
                    if(s.active) {
                        let icon = 'fa-external-link';
                        if(s.type === 'FACEBOOK') icon = 'fa-facebook';
                        if(s.type === 'TWITTER' || s.type === 'X') icon = 'fa-twitter';
                        $('#social-links').append(`<a href="${s.value}" target="_blank" style="margin: 0 10px; color: #006b98;"><i class="fa ${icon}"></i></a>`);
                    }
                });
            }

            $('#loading-screen').fadeOut();
            $('#company-content').fadeIn();
        }
    });
</script>
</body>
</html>

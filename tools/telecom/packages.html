<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../../favicon.webp" type="image/webp">
<meta name="robots" content="noindex, nofollow">
<title>باقات الإنترنت - كونكت تاق</title>
<link href="../../assets/css/bootstrap.css" rel="stylesheet">
<link href="../../assets/css/styles.min.css" rel="stylesheet">
<link href="../../assets/css/components.css" rel="stylesheet">
<script src="../../assets/js/components/components-bundle.js" defer></script>
<link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="../../assets/js/jquery.min.js"></script>

<style>
    body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
    .header-bar { background: #fff; padding: 20px 0; border-bottom: 1px solid #e1e8ed; }
    .btn-back { color: #006b98; font-weight: bold; text-decoration: none; }

    .packages-container { padding: 40px 0; }
    .pkg-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
    .pkg-card {
        background: #fff;
        border-radius: 20px;
        padding: 30px;
        border: 1px solid #eef2f3;
        box-shadow: 0 10px 25px rgba(0,0,0,0.03);
        transition: 0.3s;
        text-align: center;
        position: relative;
        overflow: hidden;
    }
    .pkg-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0,0,0,0.08); border-color: #006b98; }
    .pkg-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 5px; background: #006b98; }

    .pkg-title { font-size: 20px; font-weight: 800; color: #1e293b; margin-bottom: 15px; }
    .pkg-price { font-size: 32px; font-weight: 900; color: #e89a2f; margin-bottom: 5px; }
    .pkg-price small { font-size: 14px; color: #94a3b8; }
    .pkg-duration { color: #64748b; font-size: 14px; margin-bottom: 25px; }

    .activate-box { background: #f0f7fa; padding: 15px; border-radius: 12px; margin-top: 20px; }
    .activate-label { font-size: 12px; color: #006b98; font-weight: 800; margin-bottom: 5px; display: block; }
    .activate-code { font-size: 20px; font-weight: 900; color: #333; cursor: pointer; }
</style>
</head>
<body>
<!-- Modular Web Component: Header -->
<site-header></site-header>

<div class="header-bar">
    <div class="container">
        <div class="row">
            <div class="col-xs-6">
                <a href="javascript:history.back()" class="btn-back"><i class="fa fa-arrow-right"></i> العودة للشركة</a>
            </div>
            <div class="col-xs-6 text-left">
                <h4 id="comp-name-header" style="margin: 0; font-weight: 800; color: #1e293b;"></h4>
            </div>
        </div>
    </div>
</div>

<div class="packages-container">
    <div class="container">
        <h2 style="font-weight: 800; color: #006b98; margin-bottom: 30px;">باقات الإنترنت المتاحة</h2>
        <div class="pkg-grid" id="packages-list">
            <!-- Packages will be injected here -->
        </div>
    </div>
</div>

<script type="text/javascript">
    $(document).ready(function() {
        const urlParams = new URLSearchParams(window.location.search);
        const companyId = urlParams.get('companyId');
        const apiUrl = 'https://api.connecttag.app/v5/yemenview/initial-data';
        const apiKey = 'ws9syryf5hyd';

        $.ajax({
            url: apiUrl,
            method: 'GET',
            headers: { 'X-Api-Key': apiKey },
            success: function(response) {
                if (response.success && response.result) {
                    const comp = response.result.companies.find(c => c.id === companyId);
                    $('#comp-name-header').text(comp ? comp.arName : '');

                    const packages = response.result.packages.filter(p => p.companyId === companyId);
                    renderPackages(packages);
                }
            }
        });

        function renderPackages(packages) {
            const list = $('#packages-list');
            if(packages.length === 0) {
                list.html('<p class="text-center">لا توجد باقات مسجلة حالياً لهذه الشركة.</p>');
                return;
            }

            packages.forEach(p => {
                const item = `
                    <div class="pkg-card">
                        <div class="pkg-title">${p.arTitle}</div>
                        <div class="pkg-price">${p.price.toLocaleString()} <small>ريال</small></div>
                        <div class="pkg-duration"><i class="fa fa-clock-o"></i> صلاحية ${p.duration}</div>

                        <div class="activate-box" onclick="copyToClipboard('${p.codeActivate}')">
                            <span class="activate-label">كود التفعيل</span>
                            <span class="activate-code">${p.codeActivate} <i class="fa fa-copy" style="font-size: 14px;"></i></span>
                        </div>
                    </div>
                `;
                list.append(item);
            });
        }
    });

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => {
            alert('تم نسخ كود التفعيل: ' + text);
        });
    }
</script>
<!-- Modular Web Component: Footer -->
<site-footer></site-footer>
<!-- Modular Web Component: Cookie Consent -->
<cookie-consent></cookie-consent>
</body>
</html>

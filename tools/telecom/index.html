<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../../favicon.webp" type="image/webp">
<meta name="robots" content="noindex, nofollow">
<title>دليل شركات الاتصالات اليمنية - كونكت تاق</title>
<link href="../../assets/css/bootstrap.css" rel="stylesheet">
<link href="../../assets/css/styles.min.css" rel="stylesheet">
<link href="../../assets/css/components.css" rel="stylesheet">
<script src="../../assets/js/components/components-bundle.js" defer></script>
<link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="../../assets/js/jquery.min.js"></script>
<style>
    /* New Unified Tools Header - White Style */
    .page-header {
        background: #ffffff;
        padding: 100px 0 60px;
        color: #333;
        text-align: center;
        margin: 0;
        border: none;
        position: relative;
        border-bottom: 1px solid #eee;
    }
    .page-header h1 {
        font-weight: 800;
        font-size: 42px;
        color: #006b98 !important; /* Brand Blue */
        margin-bottom: 15px;
        position: relative;
        z-index: 1;
    }
    .page-header p {
        font-size: 18px;
        color: #64748b !important;
        max-width: 700px;
        margin: 0 auto 25px;
        position: relative;
        z-index: 1;
    }

    .breadcrumb-tools {
        list-style: none;
        display: flex;
        justify-content: center;
        gap: 10px;
        padding: 0;
        margin: 0;
        position: relative;
        z-index: 1;
    }
    .breadcrumb-tools li { color: #888; font-weight: 600; font-size: 14px; }
    .breadcrumb-tools li a { color: #006b98; text-decoration: none; transition: 0.3s; }
    .breadcrumb-tools li a:hover { color: #e89a2f; }
    .breadcrumb-tools li:not(:last-child)::after {
        content: '\f104';
        font-family: FontAwesome;
        margin-right: 10px;
        font-size: 12px;
        color: #ccc;
    }
    .breadcrumb-tools li.active { color: #e89a2f; }

    .companies-container { padding: 60px 0; }
    .company-card {
        background: #fff;
        border-radius: 20px;
        padding: 30px;
        text-align: center;
        transition: 0.3s;
        box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        margin-bottom: 30px;
        border: 1px solid #f1f5f9;
        cursor: pointer;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .company-card:hover { transform: translateY(-10px); box-shadow: 0 15px 35px rgba(0,0,0,0.1); border-color: #006b98; }
    .company-logo { width: 100px; height: 100px; object-fit: contain; margin-bottom: 20px; }
    .company-name { font-size: 22px; font-weight: 800; color: #1e293b; margin-bottom: 10px; }
    .company-desc { color: #64748b; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
    .btn-details { background: #006b98; color: #fff; border-radius: 12px; padding: 10px 25px; font-weight: 700; text-decoration: none; margin-top: auto; }
    .btn-details:hover { background: #004d6e; color: #fff; }

    .loading-overlay { text-align: center; padding: 50px; }
</style>
</head>
<body>
<!-- Modular Web Component: Header -->
<site-header></site-header>

<div class="page-header">
    <div class="container">
        <h1>دليل شركات الاتصالات</h1>
        <p>استعرض الخدمات، الأكواد، وباقات الإنترنت لكافة شركات الاتصالات في اليمن</p>
        <ul class="breadcrumb-tools">
            <li><a href="../../index.html">الرئيسية</a></li>
            <li><a href="../index.html">الأدوات</a></li>
            <li class="active">دليل الشركات</li>
        </ul>
    </div>
</div>

<div class="companies-container">
    <div class="container">
        <div class="row" id="companies-grid">
            <div class="loading-overlay col-xs-12">
                <i class="fa fa-circle-o-notch fa-spin fa-3x" style="color: #006b98;"></i>
                <p style="margin-top: 15px;">جاري تحميل قائمة الشركات...</p>
            </div>
        </div>
    </div>
</div>

<!-- Modular Web Component: Footer -->
<site-footer></site-footer>

<script type="text/javascript">
    $(document).ready(function() {
        const apiUrl = 'https://api.connecttag.app/v5/yemenview/initial-data';
        const apiKey = 'ws9syryf5hyd';

        $.ajax({
            url: apiUrl,
            method: 'GET',
            headers: { 'X-Api-Key': apiKey },
            success: function(response) {
                if (response.success && response.result && response.result.companies) {
                    renderCompanies(response.result.companies);
                } else {
                    $('#companies-grid').html('<div class="col-xs-12 text-center">عذراً، فشل تحميل البيانات.</div>');
                }
            },
            error: function() {
                $('#companies-grid').html('<div class="col-xs-12 text-center">حدث خطأ في الاتصال بالسيرفر.</div>');
            }
        });

        function renderCompanies(companies) {
            const grid = $('#companies-grid');
            grid.empty();

            companies.forEach(c => {
                const card = `
                    <div class="col-md-4 col-sm-6">
                        <div class="company-card" onclick="location.href='details.html?id=${c.id}'">
                            <img src="${c.logo}" alt="${c.arName}" class="company-logo" onerror="this.src='../../assets/img/connect-tag-official-logo.webp'">
                            <h3 class="company-name">${c.arName}</h3>
                            <p class="company-desc">${c.arDescription || 'شركة اتصالات يمنية رائدة تقدم خدمات الجوال والإنترنت.'}</p>
                            <a href="details.html?id=${c.id}" class="btn-details">عرض التفاصيل</a>
                        </div>
                    </div>
                `;
                grid.append(card);
            });
        }
    });
</script>
<!-- Modular Web Component: Cookie Consent -->
<cookie-consent></cookie-consent>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>أكواد الخدمات - كونكت تاق</title>
<link href="../../assets/css/bootstrap.css" rel="stylesheet">
<link href="../../assets/css/styles.min.css" rel="stylesheet">
<link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="../../assets/js/jquery.min.js"></script>

<style>
    body { font-family: 'Cairo', sans-serif; background-color: #f4f7f6; }

    /* Header & Navbar */
    .header-bar { background: #fff; padding: 15px 0; border-bottom: 1px solid #e2e8f0; box-shadow: 0 2px 15px rgba(0,0,0,0.02); position: sticky; top: 0; z-index: 1000; }
    .btn-back { color: #64748b; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
    .btn-back:hover { color: #006b98; transform: translateX(5px); }

    .services-main { padding: 40px 0 80px; }

    /* Search Section */
    .search-section { margin-bottom: 40px; }
    .search-wrapper { position: relative; max-width: 600px; margin: 0 auto; }
    .search-input {
        width: 100%;
        height: 55px;
        border-radius: 50px;
        border: 2px solid #e2e8f0;
        padding: 0 50px 0 25px;
        font-size: 16px;
        font-weight: 600;
        transition: 0.3s;
        box-shadow: 0 4px 6px rgba(0,0,0,0.02);
    }
    .search-input:focus { border-color: #006b98; box-shadow: 0 10px 20px rgba(0, 107, 152, 0.1); outline: none; }
    .search-icon { position: absolute; top: 50%; right: 20px; transform: translateY(-50%); color: #94a3b8; font-size: 18px; }

    /* Service Grid */
    .services-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 20px;
    }

    /* Professional Service Card */
    .service-card {
        background: #fff;
        border-radius: 20px;
        padding: 25px;
        border: 1px solid #f1f5f9;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: 100%;
        position: relative;
        overflow: hidden;
    }
    .service-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 20px 40px rgba(0,0,0,0.06);
        border-color: #006b98;
    }
    .service-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 4px; height: 100%;
        background: #006b98;
        opacity: 0; transition: 0.3s;
    }
    .service-card:hover::before { opacity: 1; }

    .card-top { display: flex; align-items: flex-start; gap: 15px; margin-bottom: 20px; }
    .service-icon-box {
        width: 50px; height: 50px;
        background: #f0f7fa;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #006b98;
        font-size: 20px;
        flex-shrink: 0;
    }
    .service-meta { flex-grow: 1; }
    .service-label { font-size: 11px; color: #94a3b8; font-weight: 800; text-transform: uppercase; margin-bottom: 4px; display: block; }
    .service-title { font-size: 18px; font-weight: 800; color: #1e293b; line-height: 1.4; margin: 0; }

    /* Modern Code Interaction */
    .code-action-box {
        background: #f8fafc;
        border: 2px solid #eef2f6;
        border-radius: 15px;
        padding: 12px 15px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        transition: 0.2s;
    }
    .code-action-box:hover { background: #f0f7fa; border-color: #006b98; }
    .code-text { font-family: 'Courier New', monospace; font-size: 20px; font-weight: 900; color: #1e293b; letter-spacing: 1px; }
    .btn-copy-action { color: #006b98; font-size: 16px; background: #fff; width: 35px; height: 35px; border-radius: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

    /* Skeleton Loading */
    .skeleton { background: #eee; background: linear-gradient(110deg, #ececec 8%, #f5f5f5 18%, #ececec 33%); border-radius: 10px; background-size: 200% 100%; animation: 1.5s shine linear infinite; }
    @keyframes shine { to { background-position-x: -200%; } }
    .skeleton-card { height: 180px; border-radius: 20px; background: #fff; padding: 25px; }

    @media (max-width: 768px) {
        .services-grid { grid-template-columns: 1fr; }
        .page-header-title { font-size: 24px !important; }
    }
</style>
</head>
<body>

<div class="header-bar">
    <div class="container">
        <div class="row" style="display: flex; align-items: center;">
            <div class="col-xs-4">
                <a href="javascript:history.back()" class="btn-back"><i class="fa fa-arrow-right"></i> رجوع</a>
            </div>
            <div class="col-xs-8 text-left">
                <div style="display: flex; align-items: center; justify-content: flex-end; gap: 10px;">
                    <span id="comp-name-header" style="font-weight: 800; color: #1e293b; font-size: 18px;"></span>
                    <img id="comp-logo-header" src="" style="height: 35px; width: 35px; object-fit: contain; border-radius: 50%; display: none;">
                </div>
            </div>
        </div>
    </div>
</div>

<div class="services-main">
    <div class="container">
        <div class="text-center" style="margin-bottom: 40px;">
            <h1 class="page-header-title" style="font-weight: 900; color: #006b98; margin-bottom: 10px;">أكواد الخدمات الذكية</h1>
            <p style="color: #64748b; font-size: 16px;">ابحث عن كود التفعيل أو الخدمة التي تحتاجها وانسخها بضغطة واحدة</p>
        </div>

        <!-- Search Bar -->
        <div class="search-section">
            <div class="search-wrapper">
                <i class="fa fa-search search-icon"></i>
                <input type="text" id="serviceSearch" class="search-input" placeholder="ابحث عن خدمة (رصيد، تفعيل، باقة...)...">
            </div>
        </div>

        <!-- Services Grid -->
        <div class="services-grid" id="services-list">
            <!-- Skeleton items while loading -->
            <div class="skeleton-card skeleton"></div>
            <div class="skeleton-card skeleton"></div>
            <div class="skeleton-card skeleton"></div>
            <div class="skeleton-card skeleton"></div>
            <div class="skeleton-card skeleton"></div>
            <div class="skeleton-card skeleton"></div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $(document).ready(function() {
        const urlParams = new URLSearchParams(window.location.search);
        const companyId = urlParams.get('companyId');
        const apiUrl = 'https://api.connecttag.app/v5/yemenview/initial-data';
        const apiKey = 'ws9syryf5hyd';
        let allServices = [];

        if (!companyId) {
            window.location.href = 'index.html';
            return;
        }

        // Fetch Data
        $.ajax({
            url: apiUrl,
            method: 'GET',
            headers: { 'X-Api-Key': apiKey },
            success: function(response) {
                if (response.success && response.result) {
                    const comp = response.result.companies.find(c => c.id === companyId);
                    if(comp) {
                        $('#comp-name-header').text(comp.arName);
                        $('#comp-logo-header').attr('src', comp.logo).show();
                    }

                    allServices = response.result.services.filter(s => s.companyId === companyId);
                    renderServices(allServices);
                }
            },
            error: function() {
                $('#services-list').html('<p class="text-center col-xs-12">عذراً، حدث خطأ أثناء تحميل البيانات.</p>');
            }
        });

        // Search Logic
        $('#serviceSearch').on('input', function() {
            const query = $(this).val().toLowerCase();
            const filtered = allServices.filter(s =>
                s.arTitle.toLowerCase().includes(query) ||
                (s.actions && s.actions[0] && s.actions[0].content.includes(query))
            );
            renderServices(filtered);
        });

        function renderServices(services) {
            const list = $('#services-list');
            list.empty();

            if(services.length === 0) {
                list.html('<div class="col-xs-12 text-center" style="padding: 50px;"><i class="fa fa-search fa-3x" style="color: #cbd5e1; margin-bottom: 20px;"></i><p style="color: #64748b; font-weight: 700;">لا توجد نتائج تطابق بحثك</p></div>');
                return;
            }

            services.forEach(s => {
                const action = s.actions && s.actions[0] ? s.actions[0].content : '';
                const item = `
                    <div class="service-card">
                        <div class="card-top">
                            <div class="service-icon-box"><i class="fa ${getIcon(s.arTitle)}"></i></div>
                            <div class="service-meta">
                                <span class="service-label">كود تفعيل</span>
                                <h3 class="service-title">${s.arTitle}</h3>
                            </div>
                        </div>
                        <div class="code-action-box" onclick="copyToClipboard('${action}')">
                            <span class="code-text" dir="ltr">${action}</span>
                            <div class="btn-copy-action"><i class="fa fa-copy"></i></div>
                        </div>
                    </div>
                `;
                list.append(item);
            });
        }

        function getIcon(title) {
            if(title.includes('رصيد')) return 'fa-money';
            if(title.includes('إنترنت') || title.includes('نت')) return 'fa-globe';
            if(title.includes('اتصال') || title.includes('دقائق')) return 'fa-phone';
            if(title.includes('سلف')) return 'fa-hand-holding-usd';
            if(title.includes('تحويل')) return 'fa-random';
            return 'fa-flash';
        }
    });

    function copyToClipboard(text) {
        if(!text) return;
        navigator.clipboard.writeText(text).then(() => {
            // Success visual feedback could be added here
            const msg = "تم نسخ الكود: " + text;
            alert(msg);
        });
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أنت غير متصل - كونكت تاق</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        body {
            background-color: #0d001a;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 20px;
            max-width: 500px;
        }
        .icon-box {
            font-size: 80px;
            color: #0077b6;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        h1 { font-size: 28px; margin-bottom: 15px; font-weight: 800; }
        p { color: #ccc; font-size: 18px; margin-bottom: 35px; line-height: 1.6; }
        .btn-retry {
            background: linear-gradient(90deg, #0077b6, #00adef);
            color: #fff;
            border: none;
            padding: 14px 40px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(0, 119, 182, 0.3);
        }
        .btn-retry:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(0, 119, 182, 0.5); }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-box"><i class="fa fa-wifi"></i></div>
        <h1>عذراً، لا يوجد اتصال بالإنترنت</h1>
        <p>يبدو أنك تواجه مشكلة في الاتصال. يمكنك محاولة إعادة تحميل الصفحة بمجرد عودة الإنترنت للوصول إلى خدمات كونكت تاق.</p>
        <button onclick="window.location.reload()" class="btn-retry">
            <i class="fa fa-refresh"></i> حاول مجدداً
        </button>
    </div>
</body>
</html>

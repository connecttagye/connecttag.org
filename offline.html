<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أنت غير متصل - كونكت تاق</title>
    <meta name="description" content="أنت غير متصل بالإنترنت حالياً. أعد الاتصال للاستمرار في تصفح موقع وخدمات كونكت تاق.">

    <link rel="preload" as="font" type="font/woff2" href="https://connecttag.org/assets/fonts/cairo-arabic.woff2?v=1.1.45" crossorigin>
    <style>
        @font-face{font-family:'Cairo';font-style:normal;font-weight:200 1000;font-display:swap;src:url('https://connecttag.org/assets/fonts/cairo-arabic.woff2?v=1.1.45') format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}

        @font-face{font-family:'Font Awesome 6 Free';font-style:normal;font-weight:900;font-display:swap;src:url('https://connecttag.org/assets/fonts/fa-solid-900.woff2?v=1.1.45') format('woff2')}
        .fa-solid{display:inline-block;font-family:'Font Awesome 6 Free';font-weight:900;font-style:normal;line-height:1;-webkit-font-smoothing:antialiased}
        .fa-wifi::before{content:'\f1eb'}.fa-rotate::before{content:'\f2f1'}
        body {
            background-color: #0a1128;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 20px;
            max-width: 500px;
        }
        .icon-box {
            font-size: 80px;
            color: #00b4d8;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        h1 { font-size: 28px; margin-bottom: 15px; font-weight: 800; }
        p { color: #ccc; font-size: 18px; margin-bottom: 35px; line-height: 1.6; }
        .btn-retry {
            background: linear-gradient(90deg, #0052cc, #00b4d8);
            color: #fff;
            border: none;
            padding: 14px 40px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(0, 82, 204, 0.3);
        }
        .btn-retry:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(0, 180, 216, 0.5); }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>

  <!-- PWA & Mobile Optimization Tags -->
  <link rel="icon" href="https://connecttag.org/favicon.webp" type="image/webp">

<body>
    <main id="main-content" class="container">
        <div class="icon-box" aria-hidden="true"><i class="fa-solid fa-wifi"></i></div>
        <h1>عذراً، لا يوجد اتصال بالإنترنت</h1>
        <p>يبدو أنك تواجه مشكلة في الاتصال. يمكنك محاولة إعادة تحميل الصفحة بمجرد عودة الإنترنت للوصول إلى خدمات كونكت تاق.</p>
        <button onclick="window.location.reload()" class="btn-retry">
            <i class="fa-solid fa-rotate" aria-hidden="true"></i> حاول مجدداً
        </button>
    </main>
<cookie-consent></cookie-consent>

<div id="contact" style="padding: 80px 0; min-height: 60vh;">
  <div class="container">
    <div class="row">
      <h2 class="centered">تواصل معنا</h2>
      <hr>
    </div>
    <div class="row">
      <div class="col-md-7">
	  <strong>ارسال رسالة الينا</strong>
        <p>في حال وجود طلبات او مقترحات او شكاوئ قم بتعبئة النموذج وارسالها الينا.</p>
        <form id="contact2" method="post" class="form" role="form">
          <div class="row">
            <div class="col-md-12 form-group">
              <input class="form-control" id="name" name="name" placeholder="الاسم" type="text" required />
            </div>
            <div class="col-md-12 form-group">
              <input class="form-control" id="email" name="email" placeholder="البريد الالكتروني" type="email" required />
            </div>
			 <div class="col-md-12 form-group">
              <textarea class="form-control" id="message" name="message" placeholder="الرسالة" rows="5"></textarea>
              <button class="btn btn-lg pull-right" type="submit">ارسال</button>
            </div>
          </div>
        </form>
      </div>
	  <div class="col-md-5">
	  <i class="fa fa-map-marker fa-2x"></i>
        <strong>كونكت تاق</strong>
		<p>اليمن<br> امانة العاصمة صنعاء</p>
      <br/>
	  <i class="fa fa-envelope-o fa-2x"></i>

       <br/>
	  </div>

<script type="text/javascript">
  $(document).ready(function() {
    $('#contact2').on('submit', function(e) {
      e.preventDefault();

      var name = $('#name').val();
      var email = $('#email').val();
      var message = $('#message').val();

      var subject = "رسالة تواصل من: " + name;
      var body = "الاسم: " + name + "\n" +
                 "البريد الإلكتروني: " + email + "\n\n" +
                 "الرسالة:\n" + message;

      var mailtoLink = "mailto:info@connecttag.org" +
                       "?subject=" + encodeURIComponent(subject) +
                       "&body=" + encodeURIComponent(body);

      window.location.href = mailtoLink;
    });
  });
</script>

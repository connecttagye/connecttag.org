<div id="order-section" style="padding: 80px 0; background: #fdfdfd;">
  <div class="container">
    <div class="row">
      <div class="col-md-8 col-md-offset-2">

        <div class="order-form-container">
            <div id="product-info">
                <span class="service-badge" id="type-label">طلب خدمة</span>
                <h3 id="item-name" style="margin: 0; font-weight: 800; color: #1e293b;">جاري تحميل تفاصيل الطلب...</h3>
            </div>

            <form id="orderForm" method="post" class="form" role="form">
              <div class="row">
                <!-- Hidden inputs for tracking -->
                <input type="hidden" id="hidden_item" name="hidden_item">
                <input type="hidden" id="hidden_type" name="hidden_type">

                <div class="col-md-6 form-group">
                  <label class="form-label" for="name">الاسم الكامل *</label>
                  <input class="form-control" id="name" name="name" placeholder="محمد علي..." type="text" required />
                </div>
                <div class="col-md-6 form-group">
                  <label class="form-label" for="email">البريد الإلكتروني *</label>
                  <input class="form-control" id="email" name="email" placeholder="example@mail.com" type="email" required />
                </div>
                <div class="col-md-6 form-group">
                  <label class="form-label" for="phone">رقم الهاتف / واتساب *</label>
                  <input class="form-control" id="phone" name="phone" placeholder="00967..." type="tel" required />
                </div>

                <div class="col-md-6 form-group" id="company-group">
                    <label class="form-label" for="company">اسم الشركة / الجهة (اختياري)</label>
                    <input class="form-control" id="company" name="company" placeholder="مثلاً: شركة تاق العقارية" type="text">
                </div>

                <div class="col-md-12 form-group" id="selection-group">
                  <label class="form-label" for="service">اختر الخدمة/المنتج *</label>
                  <select class="form-control" id="service" name="service">
                    <option value="" disabled selected>اختر من القائمة...</option>
                    <optgroup label="الخدمات البرمجية">
                        <option value="تطوير تطبيقات هاتف (Android/iOS)">تطوير تطبيقات هاتف (Android/iOS)</option>
                        <option value="تطوير مواقع ومتاجر إلكترونية">تطوير مواقع ومتاجر إلكترونية</option>
                        <option value="تطوير برامج سطح مكتب">تطوير برامج سطح مكتب</option>
                        <option value="تطوير بوتات تليجرام ذكية">تطوير بوتات تليجرام ذكية</option>
                        <option value="بناء وتطوير Rest API">بناء وتطوير Rest API</option>
                        <option value="تطوير أنظمة سحابية مخصصة">تطوير أنظمة سحابية مخصصة</option>
                    </optgroup>
                    <optgroup label="خدمات البيانات والـ API الخاصة بنا">
                        <option value="الاشتراك في API كواشف الأرقام">الاشتراك في API كواشف الأرقام</option>
                        <option value="البحث المتقدم عن TAC / IMEI">البحث المتقدم عن TAC / IMEI</option>
                        <option value="البحث عن تطبيق أو حزمة أندرويد">البحث عن تطبيق أو حزمة أندرويد</option>
                        <option value="البحث عن معلومات عنوان IP">البحث عن معلومات عنوان IP</option>
                    </optgroup>
                    <optgroup label="الاستضافة والنطاقات">
                        <option value="استضافة سحابية">استضافة سحابية</option>
                        <option value="سيرفرات خاصة VPS">سيرفرات خاصة VPS</option>
                        <option value="حجز ونقل الدومينات">حجز ونقل الدومينات</option>
                        <option value="شهادات أمان SSL">شهادات أمان SSL</option>
                        <option value="بريد إلكتروني رسمي">بريد إلكتروني رسمي</option>
                    </optgroup>
                    <optgroup label="التصميم والهوية البصرية">
                        <option value="تصميم شعار (Logo)">تصميم شعار (Logo)</option>
                        <option value="هوية بصرية كاملة">هوية بصرية كاملة</option>
                        <option value="تصاميم سوشيال ميديا">تصاميم سوشيال ميديا</option>
                        <option value="تصميم واجهات UI/UX">تصميم واجهات UI/UX</option>
                        <option value="تصميم مطبوعات وبروفايل">تصميم مطبوعات وبروفايل</option>
                    </optgroup>
                    <optgroup label="التسويق والإعلانات">
                        <option value="إعلان في شبكة تطبيقات كونكت تاق">إعلان في شبكة تطبيقات كونكت تاق</option>

<script type="text/javascript">
  document.addEventListener('DOMContentLoaded', function() {
    const params = new URLSearchParams(window.location.search);
    const item = params.get('item');
    const type = params.get('type') || 'service'; // 'service' or 'product'

    const uiItemName = document.getElementById('item-name');
    const uiTypeLabel = document.getElementById('type-label');
    const uiProductInfo = document.getElementById('product-info');
    const uiSelectionGroup = document.getElementById('selection-group');
    const uiQuantityGroup = document.getElementById('quantity-group');
    const uiDetailsLabel = document.getElementById('details-label');
    const uiSubmitBtn = document.getElementById('submit-btn');
    const uiMainHeading = document.getElementById('main-heading');

    if (item) {
        uiProductInfo.style.display = 'block';
        uiSelectionGroup.style.display = 'none';
        document.getElementById('service').required = false;

        const decodedItem = decodeURIComponent(item);
        uiItemName.innerText = decodedItem;
        document.getElementById('hidden_item').value = decodedItem;
        document.getElementById('hidden_type').value = type;

        if (type === 'product') {
            uiTypeLabel.innerText = 'طلب منتج';
            uiTypeLabel.style.background = '#fef3c7';
            uiTypeLabel.style.color = '#92400e';
            uiQuantityGroup.style.display = 'block';
            uiDetailsLabel.innerText = 'ملاحظات إضافية (اللون، المقاس، عنوان التوصيل)';
            uiMainHeading.innerText = 'طلب منتج';
            uiSubmitBtn.innerHTML = 'تأكيد طلب الشراء <i class="fa-solid fa-cart-shopping" style="margin-right: 10px;"></i>';
            document.title = "طلب " + decodedItem + " - كونكت تاق";
        } else {
            uiTypeLabel.innerText = 'طلب خدمة';
            uiDetailsLabel.innerText = 'تفاصيل المشروع أو المتطلبات الفنية';
            uiMainHeading.innerText = 'طلب خدمة';
            document.title = "طلب خدمة " + decodedItem + " - كونكت تاق";
        }
    } else {
        document.getElementById('service').required = true;
    }

    const orderForm = document.getElementById('orderForm');
    if (orderForm) {
      orderForm.addEventListener('submit', function(e) {
        e.preventDefault();

        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const phone = document.getElementById('phone').value;
        const company = document.getElementById('company').value;
        const details = document.getElementById('details').value;

        let finalItem = item ? decodeURIComponent(item) : document.getElementById('service').value;
        const quantity = document.getElementById('quantity').value;
        const finalType = type === 'product' ? 'منتج' : 'خدمة';

        const subject = `طلب ${finalType} جديد: ${finalItem} - ${name}`;

        let body = `تفاصيل الطلب من الموقع:\n`;
        body += `--------------------------\n`;
        body += `نوع الطلب: ${finalType}\n`;
        body += `المطلوب: ${finalItem}\n`;
        if (type === 'product') body += `الكمية: ${quantity}\n`;
        body += `--------------------------\n`;
        body += `الاسم: ${name}\n`;
        body += `البريد الإلكتروني: ${email}\n`;
        body += `رقم الهاتف: ${phone}\n`;
        if (company) body += `اسم الشركة: ${company}\n`;
        body += `--------------------------\n\n`;
        body += `التفاصيل والملاحظات:\n${details}`;

        let mailToAddress = "order@connecttag.org";
        if (finalItem.includes("إعلان") || finalItem.includes("تسويق")) {
            mailToAddress = "ads@connecttag.org";
        }

        const mailtoLink = "mailto:" + mailToAddress +
                         "?subject=" + encodeURIComponent(subject) +
                         "&body=" + encodeURIComponent(body);

        window.location.href = mailtoLink;
      });
    }
  });
</script>
